services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: calmguide
      POSTGRES_PASSWORD: calmguide
      POSTGRES_DB: calmguide
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmguide"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://calmguide:calmguide@db:5432/calmguide
      RAG_PGVECTOR_DSN: postgresql://calmguide:calmguide@db:5432/calmguide
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - ./rag:/app/rag

volumes:
  pgdata:
